name: Build & Publish Docker Image (GHCR + Docker Hub)

on:
  push:
    branches: [ "develop" ]      # Nightly builds
    tags: [ "*" ]                # Any tag push (e.g., 1.13 or v1.13)
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # ---- Registries & image names ----
  DOCKERHUB_IMAGE: joukojo/golang              # docker.io/your-dh-username/my-app

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3


      # ---- Log in to Docker Hub ----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- Nightly (develop) ----------
      - name: Docker meta (nightly)
        id: meta_nightly
        if: github.ref == 'refs/heads/develop'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=sha,format=short,prefix=nightly-
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}

      - name: Build & push (nightly)
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_nightly.outputs.tags }}
          labels: ${{ steps.meta_nightly.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- Release (tag) ----------
      - name: Docker meta (release)
        id: meta_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Produces the tag equal to your Git tag, e.g., "1.13" or "1.13.2"
            # If your Git tag is "v1.13", {{version}} becomes "1.13".
            type=semver,pattern={{version}}
            # Optional: also publish "latest" on every release tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version={{version}}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}

      - name: Build & push (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
